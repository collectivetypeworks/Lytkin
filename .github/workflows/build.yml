name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build fonts
        run: gftools builder sources/config.yaml

      - name: Run FontBakery
        run: fontbakery check-googlefonts 'fonts/variable/Lytkin[wght].ttf'
